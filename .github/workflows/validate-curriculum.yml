name: Validate Curriculum DB

on:
  push:
    paths:
      - "curriculum/**"
  pull_request:
    paths:
      - "curriculum/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python curriculum/scripts/validate_db.py
